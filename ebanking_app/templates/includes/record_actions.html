<!--
    Reusable View / Edit / Delete icons for one table row.
    The page that includes this file passes record_type (e.g. 'customer') and the record itself, so the links point to /customer/<id>/, /customer/<id>/edit/ and /customer/<id>/delete/.
    Each icon is a small SVG drawing. title shows a tooltip when the mouse is over it, and aria-label gives screen readers a name to read out.
-->
<td class="actions">
    <!-- This div keeps the three icons in one row -->
    <div class="icon-actions">
        <!-- data-popup tells popups.js to open this link inside the popup window instead of loading a new page -->
        <a href="{% url 'record_detail_page' record_type record.id %}" class="icon-btn view" data-popup title="View" aria-label="View {{ record }}">
            <!-- eye icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <a href="{% url 'edit_record_page' record_type record.id %}" class="icon-btn edit" data-popup title="Edit" aria-label="Edit {{ record }}">
            <!-- pencil icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </a>
        <!--
            deleting changes data, so it is sent as a POST form with a csrf_token.
            data-confirm-delete tells popups.js to show the "Are you sure?" popup before the form is sent.
            return_to=list asks delete_record_view to come back to this records page if the record cannot be deleted.
        -->
        <form method="POST" action="{% url 'delete_record_page' record_type record.id %}" data-confirm-delete="{{ record }}">
            {% csrf_token %}
            <input type="hidden" name="return_to" value="list">
            <button type="submit" class="icon-btn delete" title="Delete" aria-label="Delete {{ record }}">
                <!-- bin icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
        </form>
    </div>
</td>
